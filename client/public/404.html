<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scape Room IA</title>
  </head>
  <body>
    <script>
      (function () {
        var base = "__PAGES_BASE_PATH__";
        var path = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem("scape-redirect", path);
        window.location.replace(base);
      })();
    </script>
  </body>
</html>
