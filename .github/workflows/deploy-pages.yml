name: Deploy Scape Room IA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static Pages bundle
        run: pnpm build:pages
        env:
          PAGES_BASE_PATH: /scape-room-ia/

      - name: Set SPA base path in 404 fallback
        run: sed -i 's|__PAGES_BASE_PATH__|/scape-room-ia/|g' dist-pages/404.html

      - name: Create deep-link entry points
        run: |
          for route in prompts artes sites dia-a-dia; do
            mkdir -p "dist-pages/modulo/$route"
            cp dist-pages/index.html "dist-pages/modulo/$route/index.html"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
